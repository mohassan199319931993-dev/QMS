<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام إدارة الجودة</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <!-- خلفية متحركة -->
        <div class="animated-bg">
            <div class="bg-shape shape-1"></div>
            <div class="bg-shape shape-2"></div>
            <div class="bg-shape shape-3"></div>
            <div class="bg-shape shape-4"></div>
        </div>
        
        <div class="login-wrapper">
            <!-- الشعار والعنوان -->
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h1>نظام إدارة الجودة</h1>
                <p>Quality Management System</p>
            </div>
            
            <!-- نموذج تسجيل الدخول -->
            <div class="login-form-container">
                <form id="loginForm" class="login-form">
                    <h2>تسجيل الدخول</h2>
                    <p class="form-subtitle">أدخل بيانات الاعتماد الخاصة بك</p>
                    
                    <!-- حقل اسم المستخدم -->
                    <div class="form-group">
                        <label for="username">
                            <i class="fas fa-user"></i>
                            اسم المستخدم
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="text" 
                                id="username" 
                                name="username" 
                                placeholder="أدخل اسم المستخدم"
                                autocomplete="username"
                                required
                            >
                            <i class="fas fa-user input-icon"></i>
                        </div>
                    </div>
                    
                    <!-- حقل كلمة المرور -->
                    <div class="form-group">
                        <label for="password">
                            <i class="fas fa-lock"></i>
                            كلمة المرور
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="أدخل كلمة المرور"
                                autocomplete="current-password"
                                required
                            >
                            <i class="fas fa-lock input-icon"></i>
                            <button type="button" class="toggle-password" onclick="togglePassword()">
                                <i class="fas fa-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- تذكرني ونسيت كلمة المرور -->
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe" name="rememberMe">
                            <span class="checkmark"></span>
                            تذكرني
                        </label>
                        <a href="#" class="forgot-password" onclick="showForgotPassword()">
                            نسيت كلمة المرور؟
                        </a>
                    </div>
                    
                    <!-- زر تسجيل الدخول -->
                    <button type="submit" class="login-btn" id="loginBtn">
                        <span class="btn-text">تسجيل الدخول</span>
                        <i class="fas fa-arrow-left"></i>
                        <div class="spinner" style="display: none;">
                            <i class="fas fa-circle-notch fa-spin"></i>
                        </div>
                    </button>
                </form>
                
                <!-- رسائل الخطأ -->
                <div id="errorMessage" class="error-message" style="display: none;">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorText"></span>
                </div>
                
                <!-- حسابات تجريبية -->
                <div class="demo-accounts">
                    <p>حسابات تجريبية:</p>
                    <div class="demo-list">
                        <span class="demo-badge" onclick="fillDemo('admin', 'admin123')">admin</span>
                        <span class="demo-badge" onclick="fillDemo('quality_manager', 'manager123')">manager</span>
                        <span class="demo-badge" onclick="fillDemo('inspector1', 'insp123')">inspector</span>
                    </div>
                </div>
            </div>
            
            <!-- تذييل -->
            <div class="login-footer">
                <p>© 2024 نظام إدارة الجودة - جميع الحقوق محفوظة</p>
                <p class="version">الإصدار 2.1.0</p>
            </div>
        </div>
    </div>
    
    <!-- نافذة نسيت كلمة المرور -->
    <div id="forgotModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-key"></i> استعادة كلمة المرور</h3>
                <button class="close-btn" onclick="closeForgotModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <p>أدخل بريدك الإلكتروني وسنرسل لك رابطاً لإعادة تعيين كلمة المرور</p>
                <div class="form-group">
                    <label for="resetEmail">البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <input type="email" id="resetEmail" placeholder="your@email.com">
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                </div>
                <button class="login-btn" onclick="sendResetLink()">
                    <i class="fas fa-paper-plane"></i>
                    إرسال رابط الاستعادة
                </button>
            </div>
        </div>
    </div>
    
    <script src="js/login.js"></script>
</body>
</html>
